services:
  papercheck:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERCHECK_PORT:-4178}:4178"
    env_file: .env
    volumes:
      - ./data:/srv/papercheck/data:ro
      - ./reviews:/srv/papercheck/reviews
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4178/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
